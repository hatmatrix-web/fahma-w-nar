<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كاشير فحمة ونار</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- مكتبة Firebase عبر CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --primary: #ff5722;
      --primary-hover: #e64a19;
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
      --border-color: #2a2a30;
      --accent-green: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    .app-container { display: flex; width: 100%; height: 100%; }

    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .app-container { flex-direction: column; height: auto; }
      .menu-section { overflow-y: visible !important; height: auto !important; }
      .cart-section { width: 100% !important; height: auto !important; border-right: none !important; border-top: 2px solid var(--primary); }
    }

    .menu-section { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .header-title { font-size: 22px; color: var(--primary); padding-bottom: 12px; border-bottom: 1px solid var(--border-color); font-weight: bold; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 15px; }

    .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .item-title { font-size: 17px; font-weight: bold; color: var(--text-main); }
    .item-price { font-size: 15px; color: var(--primary); font-weight: bold; white-space: nowrap; background: rgba(255, 87, 34, 0.1); padding: 4px 8px; border-radius: 6px; }

    .options-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .option-label { font-size: 13px; background: #25252b; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
    .option-label input { accent-color: var(--primary); }

    .add-btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .add-btn:hover { background: var(--primary-hover); }

    .cart-section { width: 380px; background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
    .cart-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 18px; font-weight: bold; }

    .car-box { padding: 12px 20px; background: #25252b; border-bottom: 1px solid var(--border-color); }
    .car-box label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-muted); }
    .car-box input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: white; font-size: 14px; outline: none; }

    .cart-items { flex: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 150px; }
    .cart-item { background: var(--bg-color); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cart-item-name { font-weight: bold; font-size: 15px; }
    .cart-item-details { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .cart-item-price { color: var(--primary); font-weight: bold; font-size: 14px; margin-top: 4px; }

    .qty-btn { background: #2a2a30; color: white; border: none; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }

    .cart-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
    .total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; }
    .send-btn { background: var(--accent-green); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="menu-section">
      <div class="header-title">🔥 فحمة ونار - نقطة البيع (الكاشير)</div>

      <div class="grid-container">
        <!-- برجر -->
        <div class="item-card">
          <div class="item-header">
            <span class="item-title">برجر فحمة ونار 🍔</span>
            <span class="item-price">2.500 ر.ع</span>
          </div>
          <div class="options-group">
            <label class="option-label"><input type="checkbox" class="opt-b" value="بصل"> بصل</label>
            <label class="option-label"><input type="checkbox" class="opt-b" value="هالبينو 🌶️"> هالبينو 🌶️</label>
            <label class="option-label"><input type="checkbox" class="opt-b" value="جبن إضافي"> جبن</label>
          </div>
          <button class="add-btn" onclick="addFood('برجر فحمة ونار', 2.500, '.opt-b')">إضافة للطلب</button>
        </div>

        <!-- شاورما -->
        <div class="item-card">
          <div class="item-header">
            <span class="item-title">شاورما الصاروخ 🌯</span>
            <span class="item-price">1.800 ر.ع</span>
          </div>
          <div class="options-group">
            <label class="option-label"><input type="checkbox" class="opt-s" value="ثوم إضافي"> ثوم</label>
            <label class="option-label"><input type="checkbox" class="opt-s" value="مخلل"> مخلل</label>
            <label class="option-label"><input type="checkbox" class="opt-s" value="شطة 🌶️"> شطة 🌶️</label>
          </div>
          <button class="add-btn" onclick="addFood('شاورما الصاروخ', 1.800, '.opt-s')">إضافة للطلب</button>
        </div>

        <!-- بطاطس -->
        <div class="item-card">
          <div class="item-header">
            <span class="item-title">بطاطس مقلية 🍟</span>
            <span class="item-price">1.000 ر.ع</span>
          </div>
          <div class="options-group">
            <label class="option-label"><input type="checkbox" class="opt-f" value="جبن ذائب"> جبن</label>
            <label class="option-label"><input type="checkbox" class="opt-f" value="بهارات حارة"> بهارات</label>
          </div>
          <button class="add-btn" onclick="addFood('بطاطس مقلية', 1.000, '.opt-f')">إضافة للطلب</button>
        </div>

        <!-- مشروب -->
        <div class="item-card">
          <div class="item-header">
            <span class="item-title">مشروب غازي 🥤</span>
            <span class="item-price">0.500 ر.ع</span>
          </div>
          <div class="options-group">
            <label class="option-label"><input type="radio" name="drink" value="بيبسي" checked> بيبسي</label>
            <label class="option-label"><input type="radio" name="drink" value="ديو"> ديو</label>
            <label class="option-label"><input type="radio" name="drink" value="كينزا"> كينزا</label>
            <label class="option-label"><input type="radio" name="drink" value="سفن أب"> سفن أب</label>
          </div>
          <button class="add-btn" onclick="addDrink('مشروب غازي', 0.500)">إضافة للطلب</button>
        </div>
      </div>
    </div>

    <div class="cart-section">
      <div class="cart-header">🛒 الطلب الحالي</div>
      
      <div class="car-box">
        <label>🚘 رقم السيارة / اسم الزبون:</label>
        <input type="text" id="car-num" placeholder="أدخل رقم أو لون السيارة...">
      </div>

      <div class="cart-items" id="cart-list"></div>

      <div class="cart-footer">
        <div class="total-row">
          <span>المجموع:</span>
          <span id="cart-total">0.000 ر.ع</span>
        </div>
        <button class="send-btn" onclick="sendOrder()">إرسال الطلب للمطبخ 🚀</button>
      </div>
    </div>
  </div>

  <script>
    // ربط قاعدة بيانات Firebase
    const firebaseConfig = {
      databaseURL: "https://fahma-w-nar-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let cart = [];

    function addFood(name, price, selector) {
      const boxes = document.querySelectorAll(selector + ':checked');
      let options = [];
      boxes.forEach(cb => options.push(cb.value));

      const idx = cart.findIndex(i => i.name === name && JSON.stringify(i.options) === JSON.stringify(options));
      if (idx > -1) { cart[idx].qty += 1; }
      else { cart.push({ name: name, price: price, options: options, qty: 1 }); }

      boxes.forEach(cb => cb.checked = false);
      updateUI();
    }

    function addDrink(name, price) {
      const drink = document.querySelector('input[name="drink"]:checked').value;
      const options = [drink];

      const idx = cart.findIndex(i => i.name === name && JSON.stringify(i.options) === JSON.stringify(options));
      if (idx > -1) { cart[idx].qty += 1; }
      else { cart.push({ name: name, price: price, options: options, qty: 1 }); }

      updateUI();
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      updateUI();
    }

    function updateUI() {
      const list = document.getElementById('cart-list');
      list.innerHTML = '';
      let sum = 0;

      cart.forEach((item, i) => {
        const itemTotal = item.price * item.qty;
        sum += itemTotal;
        const optsStr = item.options.length > 0 ? item.options.join(' ، ') : 'بدون إضافات';

        list.innerHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-name">${item.name} x${item.qty}</div>
              <div class="cart-item-details">${optsStr}</div>
              <div class="cart-item-price">${itemTotal.toFixed(3)} ر.ع</div>
            </div>
            <div>
              <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
              <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cart-total').innerText = sum.toFixed(3) + ' ر.ع';
    }

    function sendOrder() {
      if (cart.length === 0) { 
        alert('السلة فارغة!'); 
        return; 
      }

      const confirmSend = confirm('هل أنت متأكد من إرسال هذا الطلب إلى المطبخ؟');
      if (!confirmSend) return;

      const car = document.getElementById('car-num').value.trim() || 'غير محدد';
      const todayDateStr = new Date().toLocaleDateString('ar-SA');

      database.ref('counter').once('value', (snapshot) => {
        let data = snapshot.val() || { date: todayDateStr, num: 0 };
        
        if (data.date !== todayDateStr) {
          data = { date: todayDateStr, num: 0 };
        }
        
        data.num += 1;
        database.ref('counter').set(data);

        const total = cart.reduce((s, item) => s + (item.price * item.qty), 0);
        const newOrder = {
          id: Date.now(),
          orderNum: data.num,
          car: car,
          items: cart,
          total: total,
          date: todayDateStr,
          time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
        };

        database.ref('kitchen_orders').push(newOrder);
        database.ref('sales_reports').push(newOrder);

        alert(`تم إرسال الطلب رقم #${data.num} للمطبخ بنجاح! 🚀`);
        cart = [];
        document.getElementById('car-num').value = '';
        updateUI();
      });
    }
  </script>
</body>
</html>
