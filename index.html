<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكاشير - فحمة ونار</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --primary: #ff5722;
      --text-main: #ffffff;
      --border-color: #2a2a30;
      --text-muted: #a0a0ab;
      --success: #4caf50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }

    .app-container { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
    
    .menu-section { width: 100%; }
    .cart-section { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .header h1 { color: var(--primary); font-size: 22px; }

    .btn-ready-alert { background: #25252b; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: 0.3s; }
    .btn-ready-alert.has-ready { background: var(--success); color: white; border-color: var(--success); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .categories-bar { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .cat-btn { background: #25252b; border: 1px solid var(--border-color); color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .cat-btn.active { background: var(--primary); border-color: var(--primary); }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
    .item-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .item-card img { width: 100%; height: 85px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .item-card h3 { font-size: 13px; margin-bottom: 4px; }
    .item-card p { color: var(--primary); font-weight: bold; font-size: 13px; }

    /* تأثير وميض وانكماش خاطف عند الضغط على الوجبة */
    .item-card.card-click-effect {
      transform: scale(0.94);
      border-color: var(--primary) !important;
      box-shadow: 0 0 12px rgba(255, 87, 34, 0.6);
      transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
    }

    .cart-items { max-height: 200px; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #25252b; padding: 8px 12px; border-radius: 8px; }
    .cart-controls { display: flex; gap: 8px; align-items: center; }
    .btn-qty { background: var(--primary); border: none; color: white; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .car-number-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #25252b; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; text-align: center; font-weight: bold; }

    .cart-summary { display: flex; flex-direction: column; gap: 8px; }
    .total-price { font-size: 20px; font-weight: bold; color: var(--primary); text-align: center; }
    .checkout-btn { background: var(--primary); border: none; color: white; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
    .modal-title { font-size: 18px; color: var(--primary); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .addon-option { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #25252b; padding: 10px; border-radius: 6px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .btn-modal { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-confirm { background: var(--primary); color: white; }
    .btn-cancel { background: #3a3a42; color: white; }

    .ready-item-card { background: #25252b; border: 1px solid var(--success); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-deliver { background: var(--success); border: none; color: white; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="menu-section">
      <div class="header">
        <h1>🔥 فحمة ونار - الكاشير</h1>
        <button id="ready-alert-btn" class="btn-ready-alert" onclick="openReadyOrdersModal()">
          <span>🔔 الطلبات الجاهزة</span>
          <span id="ready-count">(0)</span>
        </button>
      </div>

      <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('burgers')">البرجر والوجبات</button>
        <button class="cat-btn" onclick="filterCategory('skewers')">المشاكيك</button>
        <button class="cat-btn" onclick="filterCategory('sides')">الفرايز والشوربات</button>
        <button class="cat-btn" onclick="filterCategory('drinks')">المشروبات</button>
        <button class="cat-btn" onclick="filterCategory('snacks')">مقرمشات</button>
      </div>

      <div class="grid-container" id="menu-grid"></div>
    </div>

    <div class="cart-section">
      <div>
        <h2>تفاصيل الطلب</h2>
        <br>
        <div class="cart-items" id="cart-list"></div>
      </div>

      <div class="cart-summary">
        <input type="text" id="car-number" class="car-number-input" placeholder="🚗 رقم السيارة (اختياري)">
        
        <div style="display: flex; justify-content: space-between;">
          <span>الإجمالي:</span>
          <span class="total-price" id="total-price">0.000 ر.ع</span>
        </div>
        <button class="checkout-btn" onclick="submitOrder()">إرسال للمطبخ 🚀</button>
      </div>
    </div>
  </div>

  <!-- نافذة إضافات الوجبة -->
  <div class="modal-overlay" id="addon-modal">
    <div class="modal-content">
      <h3 class="modal-title" id="modal-item-name">إضافات الوجبة</h3>
      <div id="addons-list"></div>
      <div class="modal-actions">
        <button class="btn-modal btn-confirm" onclick="confirmAddToCart()">إضافة للطلب</button>
        <button class="btn-modal btn-cancel" onclick="closeAddonModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة عرض الطلبات الجاهزة للاستلام -->
  <div class="modal-overlay" id="ready-modal">
    <div class="modal-content">
      <div class="modal-title">
        <span style="color: var(--success);">🔔 الطلبات الجاهزة للاستلام</span>
        <button onclick="closeReadyModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="ready-orders-list">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد طلبات جاهزة حالياً...</div>
      </div>
      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeReadyModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://fahma-w-nar-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // إضافات الوجبات مجانية بالكامل (السعر 0.000)
    const categoryAddons = {
      burgers: [
        { name: "🌶️ هالبينو", price: 0.000 },
        { name: "🔴 رمان", price: 0.000 },
        { name: "🧅 بصل", price: 0.000 }
      ],
      sides: [
        { name: "🌶️ هالبينو", price: 0.000 }
      ],
      skewers: [
        { name: "🥫 صبار", price: 0.000 }
      ]
    };

    // قائمة الأصناف الكاملة (مضاف إليها الماء مع المشروبات)
    const menuItems = [
      { id: 1, name: "برجر لحم كلاسيك", price: 1.000, category: "burgers", image: "beef_burger.png.jpeg", hasAddons: true },
      { id: 2, name: "برجر ستيك صدر دجاج", price: 1.000, category: "burgers", image: "chicken_steak.png.jpeg", hasAddons: true },
      { id: 3, name: "فاير بريوش لحم", price: 1.200, category: "burgers", image: "fire_brioche.png.jpeg", hasAddons: true },
      { id: 4, name: "فاير بريوش دبل لحم", price: 1.400, category: "burgers", image: "double_fire_brioche.png.jpeg", hasAddons: true },
      { id: 5, name: "فاير بريوش دجاج", price: 1.200, category: "burgers", image: "chicken_steak.png.jpeg", hasAddons: true },
      { id: 6, name: "صاروخ مشكاك لحم", price: 1.000, category: "burgers", image: "beef_rocket.png.jpeg", hasAddons: false },
      { id: 7, name: "صاروخ مشكاك دجاج", price: 1.000, category: "burgers", image: "chicken_rocket.png.jpeg", hasAddons: false },

      { id: 8, name: "مشكاك لحم استرالي", price: 0.200, category: "skewers", image: "beef_aust_skewer.png.jpeg", hasAddons: true },
      { id: 9, name: "مشكاك لحم بوش", price: 0.200, category: "skewers", image: "beef_cam_skewer.png.jpeg", hasAddons: true },
      { id: 10, name: "مشكاك دجاج", price: 0.200, category: "skewers", image: "chicken_skewer.png.jpeg", hasAddons: true },
      { id: 11, name: "مشكاك بقر", price: 0.100, category: "skewers", image: "beef_cow_skewer.png.jpeg", hasAddons: true },
      { id: 12, name: "مشكاك جمل", price: 0.200, category: "skewers", image: "beef_cam_skewer.png.jpeg", hasAddons: true },
      { id: 13, name: "مشكاك حبار", price: 0.200, category: "skewers", image: "squid_skewer.png.jpeg", hasAddons: true },

      { id: 14, name: "فرايز عادي", price: 0.500, category: "sides", image: "plain_fries.png.jpeg", hasAddons: false },
      { id: 15, name: "فرايز سبايسي", price: 0.600, category: "sides", image: "spicy_fries.png.jpeg", hasAddons: false },
      { id: 16, name: "فرايز لحم - صغير", price: 1.000, category: "sides", image: "beef_fries.png.jpeg", hasAddons: true },
      { id: 17, name: "فرايز دجاج - صغير", price: 1.000, category: "sides", image: "chicken_fries.png.jpeg", hasAddons: true },
      { id: 18, name: "فرايز لحم - كبير", price: 1.200, category: "sides", image: "beef_fries.png.jpeg", hasAddons: true },
      { id: 19, name: "فرايز دجاج - كبير", price: 1.200, category: "sides", image: "chicken_fries.png.jpeg", hasAddons: true },
      { id: 20, name: "شوربة بحرية", price: 0.500, category: "sides", image: "seafood_soup.png.jpeg", hasAddons: false },

      { id: 21, name: "كولا", price: 0.300, category: "drinks", image: "soft_drinks.png.jpeg", hasAddons: false },
      { id: 22, name: "كينزا", price: 0.200, category: "drinks", image: "soft_drinks.png.jpeg", hasAddons: false },
      { id: 23, name: "بيبسي", price: 0.300, category: "drinks", image: "soft_drinks.png.jpeg", hasAddons: false },
      { id: 24, name: "ديو", price: 0.300, category: "drinks", image: "soft_drinks.png.jpeg", hasAddons: false },
      { id: 25, name: "موهيتو", price: 0.600, category: "drinks", image: "mojito.png.jpeg", hasAddons: false },
      { id: 26, name: "ماء", price: 0.100, category: "drinks", image: "water.png.jpeg", hasAddons: false },
      { id: 27, name: "كرك", price: 0.100, category: "drinks", image: "hot_drinks.png.jpeg", hasAddons: false },
      { id: 28, name: "شاي أحمر", price: 0.100, category: "drinks", image: "hot_drinks.png.jpeg", hasAddons: false },

      { id: 29, name: "فشار فحمة ونار", price: 0.500, category: "snacks", image: "popcorn.png.jpeg", hasAddons: false }
    ];

    let cart = [];
    let selectedItemForAddons = null;

    function renderMenu(category = 'burgers') {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      
      const filtered = menuItems.filter(i => i.category === category);
      
      filtered.forEach(item => {
        grid.innerHTML += `
          <div class="item-card" onclick="handleItemClick(${item.id})">
            <img src="${item.image}" alt="${item.name}" onerror="handleImageError(this, '${item.image}')">
            <h3>${item.name}</h3>
            <p>${item.price.toFixed(3)} ر.ع</p>
          </div>
        `;
      });
    }

    function handleImageError(imgElement, originalSrc) {
      if (!imgElement.getAttribute('data-retried')) {
        imgElement.setAttribute('data-retried', 'true');
        imgElement.src = 'fahma_w_nar/' + originalSrc;
      }
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMenu(cat);
    }

    function handleItemClick(itemId) {
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      const card = event.currentTarget;
      if (card) {
        card.classList.add('card-click-effect');
        setTimeout(() => {
          card.classList.remove('card-click-effect');
        }, 120);
      }

      const item = menuItems.find(i => i.id === itemId);
      const availableAddons = categoryAddons[item.category];

      if (item.hasAddons && availableAddons && availableAddons.length > 0) {
        selectedItemForAddons = item;
        document.getElementById('modal-item-name').innerText = `إضافات: ${item.name}`;
        
        const addonsList = document.getElementById('addons-list');
        addonsList.innerHTML = '';

        availableAddons.forEach(addon => {
          addonsList.innerHTML += `
            <label class="addon-option">
              <span>${addon.name}</span>
              <input type="checkbox" value="${addon.name}" data-price="${addon.price}">
            </label>
          `;
        });

        document.getElementById('addon-modal').style.display = 'flex';
      } else {
        addItemToCartDirectly(item, [], 0);
      }
    }

    function closeAddonModal() {
      document.getElementById('addon-modal').style.display = 'none';
      selectedItemForAddons = null;
    }

    function confirmAddToCart() {
      if (!selectedItemForAddons) return;
      
      let selectedAddons = [];
      let extraPrice = 0;

      document.querySelectorAll('#addons-list input:checked').forEach(input => {
        selectedAddons.push(input.value);
        extraPrice += parseFloat(input.getAttribute('data-price'));
      });

      addItemToCartDirectly(selectedItemForAddons, selectedAddons, extraPrice);
      closeAddonModal();
    }

    function addItemToCartDirectly(item, addons, extraPrice) {
      const itemTotalPrice = item.price + extraPrice;
      const addonsText = addons.length > 0 ? ` (${addons.join('، ')})` : '';
      const fullName = item.name + addonsText;

      const existingItem = cart.find(c => c.name === fullName);
      if (existingItem) {
        existingItem.qty += 1;
      } else {
        cart.push({
          id: Date.now(),
          originalId: item.id,
          name: fullName,
          price: itemTotalPrice,
          qty: 1
        });
      }

      updateCart();
    }

    function changeQty(cartItemId, delta) {
      const cartItem = cart.find(c => c.id === cartItemId);
      if (cartItem) {
        cartItem.qty += delta;
        if (cartItem.qty <= 0) {
          cart = cart.filter(c => c.id !== cartItemId);
        }
      }
      updateCart();
    }

    function updateCart() {
      const list = document.getElementById('cart-list');
      list.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        list.innerHTML += `
          <div class="cart-item">
            <div>
              <div style="font-weight:bold; font-size: 13px;">${item.name}</div>
              <small style="color:var(--text-muted);">${item.price.toFixed(3)} × ${item.qty}</small>
            </div>
            <div class="cart-controls">
              <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('total-price').innerText = total.toFixed(3) + ' ر.ع';
    }

    function submitOrder() {
      if (cart.length === 0) {
        alert('يرجى إضافة أصناف للطلب أولاً!');
        return;
      }

      const confirmSend = confirm('هل أنت متأكد من إرسال الطلب للمطبخ؟');
      if (!confirmSend) {
        return;
      }

      const carNumber = document.getElementById('car-number').value.trim();

      const now = new Date();
      const formattedDateOnly = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

      database.ref('last_order_date').once('value').then(dateSnapshot => {
        const lastDate = dateSnapshot.val();

        if (lastDate !== formattedDateOnly) {
          database.ref('counter').set(0);
          database.ref('last_order_date').set(formattedDateOnly);
        }

        database.ref('counter').transaction(current => (current || 0) + 1, (error, committed, snapshot) => {
          if (committed) {
            const orderNum = snapshot.val();
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const kitchenOrderData = {
              orderNum: orderNum,
              carNumber: carNumber || "بدون سيارة",
              items: cart,
              total: total,
              status: "جديد",
              timestamp: Date.now(),
              date: new Date().toLocaleString('ar-EG')
            };

            const salesReportData = {
              orderNum: orderNum,
              items: cart,
              total: total,
              timestamp: Date.now(),
              date: new Date().toLocaleString('ar-EG'),
              dateOnly: formattedDateOnly
            };

            database.ref('kitchen_orders').push(kitchenOrderData);
            database.ref('sales_reports').push(salesReportData);

            alert(`تم إرسال الطلب رقم #${orderNum} للمطبخ بنجاح! 👨‍🍳`);
            cart = [];
            document.getElementById('car-number').value = '';
            updateCart();
          }
        });
      });
    }

    function openReadyOrdersModal() {
      document.getElementById('ready-modal').style.display = 'flex';
    }

    function closeReadyModal() {
      document.getElementById('ready-modal').style.display = 'none';
    }

    database.ref('kitchen_orders').on('value', (snapshot) => {
      const readyList = document.getElementById('ready-orders-list');
      const alertBtn = document.getElementById('ready-alert-btn');
      const countSpan = document.getElementById('ready-count');
      
      readyList.innerHTML = '';
      const orders = snapshot.val();
      let readyCount = 0;

      if (orders) {
        Object.keys(orders).forEach(key => {
          const order = orders[key];
          if (order.status === "مكتمل") {
            readyCount++;
            readyList.innerHTML += `
              <div class="ready-item-card">
                <div>
                  <div style="font-weight:bold; color:var(--success); font-size:16px;">طلب #${order.orderNum}</div>
                  <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">🚗 ${order.carNumber || 'بدون سيارة'}</div>
                </div>
                <button class="btn-deliver" onclick="deliverOrder('${key}')">تم التسليم ✓</button>
              </div>
            `;
          }
        });
      }

      countSpan.innerText = `(${readyCount})`;

      if (readyCount > 0) {
        alertBtn.classList.add('has-ready');
      } else {
        alertBtn.classList.remove('has-ready');
        readyList.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد طلبات جاهزة حالياً...</div>`;
      }
    });

    function deliverOrder(orderKey) {
      database.ref('kitchen_orders/' + orderKey).remove();
    }

    renderMenu('burgers');
  </script>
</body>
</html>
