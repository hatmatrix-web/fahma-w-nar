<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكاشير - فحمة ونار</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --primary: #ff5722;
      --text-main: #ffffff;
      --border-color: #2a2a30;
      --text-muted: #a0a0ab;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }

    .app-container { display: flex; gap: 20px; height: calc(100vh - 30px); flex-wrap: wrap; }
    
    .menu-section { flex: 2; overflow-y: auto; padding-left: 10px; min-width: 320px; }
    .cart-section { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-width: 300px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .header h1 { color: var(--primary); font-size: 22px; }

    .categories-bar { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .cat-btn { background: #25252b; border: 1px solid var(--border-color); color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .cat-btn.active { background: var(--primary); border-color: var(--primary); }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
    .item-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .item-card img { width: 100%; height: 85px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .item-card h3 { font-size: 13px; margin-bottom: 4px; }
    .item-card p { color: var(--primary); font-weight: bold; font-size: 13px; }

    .cart-items { flex: 1; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #25252b; padding: 8px 12px; border-radius: 8px; }
    .cart-controls { display: flex; gap: 8px; align-items: center; }
    .btn-qty { background: var(--primary); border: none; color: white; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .car-number-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #25252b; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; text-align: center; font-weight: bold; }

    .cart-summary { display: flex; flex-direction: column; gap: 8px; }
    .total-price { font-size: 20px; font-weight: bold; color: var(--primary); text-align: center; }
    .checkout-btn { background: var(--primary); border: none; color: white; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }

    /* تصميم نافذة الإضافات (Modal) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; }
    .modal-title { font-size: 18px; color: var(--primary); margin-bottom: 15px; }
    .addon-option { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #25252b; padding: 10px; border-radius: 6px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .btn-modal { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-confirm { background: var(--primary); color: white; }
    .btn-cancel { background: #3a3a42; color: white; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- قسم المنيو -->
    <div class="menu-section">
      <div class="header">
        <h1>🔥 فحمة ونار - الكاشير</h1>
        <span id="order-id-view" style="color: var(--text-muted);">طلب جديد</span>
      </div>

      <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('burgers')">البرجر والوجبات</button>
        <button class="cat-btn" onclick="filterCategory('skewers')">المشاكيك</button>
        <button class="cat-btn" onclick="filterCategory('sides')">الفرايز والشوربات</button>
        <button class="cat-btn" onclick="filterCategory('drinks')">المشروبات</button>
        <button class="cat-btn" onclick="filterCategory('snacks')">مقرمشات</button>
      </div>

      <div class="grid-container" id="menu-grid"></div>
    </div>

    <!-- قسم الفاتورة والطلب -->
    <div class="cart-section">
      <div>
        <h2>تفاصيل الطلب</h2>
        <br>
        <div class="cart-items" id="cart-list"></div>
      </div>

      <div class="cart-summary">
        <input type="text" id="car-number" class="car-number-input" placeholder="🚗 رقم السيارة (اختياري)">
        
        <div style="display: flex; justify-content: space-between;">
          <span>الإجمالي:</span>
          <span class="total-price" id="total-price">0.000 ر.ع</span>
        </div>
        <button class="checkout-btn" onclick="submitOrder()">إرسال للمطبخ 🚀</button>
      </div>
    </div>
  </div>

  <!-- نافذة التعديلات والإضافات الخاصة بالبرجر والفرايز -->
  <div class="modal-overlay" id="addon-modal">
    <div class="modal-content">
      <h3 class="modal-title" id="modal-item-name">إضافات الوجبة</h3>
      <div id="addons-list">
        <label class="addon-option">
          <span>🌶️ هالبينو</span>
          <input type="checkbox" value="هالبينو" data-price="0.100">
        </label>
        <label class="addon-option">
          <span>🧅 بصل مكرمل</span>
          <input type="checkbox" value="بصل مكرمل" data-price="0.100">
        </label>
        <label class="addon-option">
          <span>🧀 جبن إضافي</span>
          <input type="checkbox" value="جبن إضافي" data-price="0.200">
        </label>
        <label class="addon-option">
          <span>🔥 صوص فاير إضافي</span>
          <input type="checkbox" value="صوص فاير" data-price="0.100">
        </label>
        <label class="addon-option">
          <span>🚫 بدون بصل</span>
          <input type="checkbox" value="بدون بصل" data-price="0.000">
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-modal btn-confirm" onclick="confirmAddToCart()">إضافة للطلب</button>
        <button class="btn-modal btn-cancel" onclick="closeAddonModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://fahma-w-nar-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const menuItems = [
      { id: 1, name: "برجر لحم كلاسيك", price: 1.000, category: "burgers", image: "beef_burger.png", hasAddons: true },
      { id: 2, name: "برجر ستيك صدر دجاج", price: 1.000, category: "burgers", image: "chicken_steak.png", hasAddons: true },
      { id: 3, name: "فاير بريوش لحم", price: 1.200, category: "burgers", image: "fire_brioche.png", hasAddons: true },
      { id: 4, name: "فاير بريوش دبل لحم", price: 1.400, category: "burgers", image: "double_fire_brioche.png", hasAddons: true },
      { id: 5, name: "فاير بريوش دجاج", price: 1.200, category: "burgers", image: "chicken_steak.png", hasAddons: true },
      { id: 6, name: "صاروخ مشكاك لحم", price: 1.000, category: "burgers", image: "beef_rocket.png", hasAddons: true },
      { id: 7, name: "صاروخ مشكاك دجاج", price: 1.000, category: "burgers", image: "chicken_rocket.png", hasAddons: true },

      { id: 8, name: "مشكاك لحم استرالي", price: 0.200, category: "skewers", image: "beef_aust_skewer.png", hasAddons: false },
      { id: 9, name: "مشكاك لحم بوش", price: 0.200, category: "skewers", image: "beef_cam_skewer.png", hasAddons: false },
      { id: 10, name: "مشكاك دجاج", price: 0.200, category: "skewers", image: "chicken_skewer.png", hasAddons: false },
      { id: 11, name: "مشكاك بقر", price: 0.100, category: "skewers", image: "beef_cow_skewer.png", hasAddons: false },
      { id: 12, name: "مشكاك جمل", price: 0.200, category: "skewers", image: "beef_cam_skewer.png", hasAddons: false },
      { id: 13, name: "مشكاك حبار", price: 0.200, category: "skewers", image: "squid_skewer.png", hasAddons: false },

      { id: 14, name: "فرايز عادي", price: 0.500, category: "sides", image: "plain_fries.png", hasAddons: true },
      { id: 15, name: "فرايز سبايسي", price: 0.600, category: "sides", image: "spicy_fries.png", hasAddons: true },
      { id: 16, name: "فرايز لحم - صغير", price: 1.000, category: "sides", image: "beef_fries.png", hasAddons: true },
      { id: 17, name: "فرايز دجاج - صغير", price: 1.000, category: "sides", image: "chicken_fries.png", hasAddons: true },
      { id: 18, name: "فرايز لحم - كبير", price: 1.200, category: "sides", image: "beef_fries.png", hasAddons: true },
      { id: 19, name: "فرايز دجاج - كبير", price: 1.200, category: "sides", image: "chicken_fries.png", hasAddons: true },
      { id: 20, name: "شوربة بحرية", price: 0.500, category: "sides", image: "seafood_soup.png", hasAddons: false },

      { id: 21, name: "كولا", price: 0.300, category: "drinks", image: "soft_drinks.png", hasAddons: false },
      { id: 22, name: "كينزا", price: 0.200, category: "drinks", image: "soft_drinks.png", hasAddons: false },
      { id: 23, name: "بيبسي", price: 0.300, category: "drinks", image: "soft_drinks.png", hasAddons: false },
      { id: 24, name: "ديو", price: 0.300, category: "drinks", image: "soft_drinks.png", hasAddons: false },
      { id: 25, name: "موهيتو", price: 0.600, category: "drinks", image: "mojito.png", hasAddons: false },
      { id: 26, name: "كرك", price: 0.100, category: "drinks", image: "hot_drinks.png", hasAddons: false },
      { id: 27, name: "شاي أحمر", price: 0.100, category: "drinks", image: "hot_drinks.png", hasAddons: false },

      { id: 28, name: "فشار فحمة ونار", price: 0.500, category: "snacks", image: "popcorn.png", hasAddons: false }
    ];

    let cart = [];
    let selectedItemForAddons = null;

    function renderMenu(category = 'burgers') {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';
      
      const filtered = menuItems.filter(i => i.category === category);
      
      filtered.forEach(item => {
        grid.innerHTML += `
          <div class="item-card" onclick="handleItemClick(${item.id})">
            <img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'">
            <h3>${item.name}</h3>
            <p>${item.price.toFixed(3)} ر.ع</p>
          </div>
        `;
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMenu(cat);
    }

    function handleItemClick(itemId) {
      const item = menuItems.find(i => i.id === itemId);
      if (item.hasAddons) {
        selectedItemForAddons = item;
        document.getElementById('modal-item-name').innerText = `تعديل وإضافات: ${item.name}`;
        document.querySelectorAll('#addons-list input').forEach(input => input.checked = false);
        document.getElementById('addon-modal').style.display = 'flex';
      } else {
        addItemToCartDirectly(item, [], 0);
      }
    }

    function closeAddonModal() {
      document.getElementById('addon-modal').style.display = 'none';
      selectedItemForAddons = null;
    }

    function confirmAddToCart() {
      if (!selectedItemForAddons) return;
      
      let selectedAddons = [];
      let extraPrice = 0;

      document.querySelectorAll('#addons-list input:checked').forEach(input => {
        selectedAddons.push(input.value);
        extraPrice += parseFloat(input.getAttribute('data-price'));
      });

      addItemToCartDirectly(selectedItemForAddons, selectedAddons, extraPrice);
      closeAddonModal();
    }

    function addItemToCartDirectly(item, addons, extraPrice) {
      const itemTotalPrice = item.price + extraPrice;
      const addonsText = addons.length > 0 ? ` (${addons.join('، ')})` : '';
      
      cart.push({
        id: Date.now(),
        originalId: item.id,
        name: item.name + addonsText,
        price: itemTotalPrice,
        qty: 1
      });

      updateCart();
    }

    function changeQty(cartItemId, delta) {
      const cartItem = cart.find(c => c.id === cartItemId);
      if (cartItem) {
        cartItem.qty += delta;
        if (cartItem.qty <= 0) {
          cart = cart.filter(c => c.id !== cartItemId);
        }
      }
      updateCart();
    }

    function updateCart() {
      const list = document.getElementById('cart-list');
      list.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        list.innerHTML += `
          <div class="cart-item">
            <div>
              <div style="font-weight:bold; font-size: 13px;">${item.name}</div>
              <small style="color:var(--text-muted);">${item.price.toFixed(3)} × ${item.qty}</small>
            </div>
            <div class="cart-controls">
              <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('total-price').innerText = total.toFixed(3) + ' ر.ع';
    }

    function submitOrder() {
      if (cart.length === 0) {
        alert('يرجى إضافة أصناف للطلب أولاً!');
        return;
      }

      const carNumber = document.getElementById('car-number').value.trim();

      database.ref('counter').transaction(current => (current || 0) + 1, (error, committed, snapshot) => {
        if (committed) {
          const orderNum = snapshot.val();
          const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
          
          // بيانات المطبخ تتضمن رقم السيارة
          const kitchenOrderData = {
            orderNum: orderNum,
            carNumber: carNumber || "بدون سيارة",
            items: cart,
            total: total,
            status: "جديد",
            timestamp: Date.now(),
            date: new Date().toLocaleString('ar-EG')
          };

          // تقارير المبيعات بدون رقم السيارة (فقط الأصناف والأسعار والطلب)
          const salesReportData = {
            orderNum: orderNum,
            items: cart,
            total: total,
            timestamp: Date.now(),
            date: new Date().toLocaleString('ar-EG')
          };

          database.ref('kitchen_orders').push(kitchenOrderData);
          database.ref('sales_reports').push(salesReportData);

          alert(`تم إرسال الطلب رقم #${orderNum} للمطبخ بنجاح! 👨‍🍳`);
          cart = [];
          document.getElementById('car-number').value = '';
          updateCart();
        }
      });
    }

    renderMenu('burgers');
  </script>
</body>
</html>
