<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطبخ - فحمة ونار</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --primary: #ff5722;
      --text-main: #ffffff;
      --border-color: #2a2a30;
      --text-muted: #a0a0ab;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .header h1 { color: var(--primary); font-size: 24px; }

    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    
    .order-card { background: var(--card-bg); border: 2px solid var(--primary); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(255, 87, 34, 0.2); }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 10px; }
    .order-number { font-size: 20px; font-weight: bold; color: var(--primary); }
    .car-tag { background: #ff572222; color: var(--primary); padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; border: 1px solid var(--primary); }
    
    .order-items { list-style: none; margin-bottom: 15px; max-height: 180px; overflow-y: auto; }
    .order-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border-color); font-size: 15px; }
    
    .btn-done { background: #4caf50; border: none; color: white; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-done:hover { background: #43a047; }
    
    .no-orders { text-align: center; color: var(--text-muted); grid-column: 1 / -1; margin-top: 50px; font-size: 18px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>👨‍🍳 شاشة المطبخ - فحمة ونار</h1>
    <span style="color: #4caf50; font-weight: bold; font-size: 14px;">🔊 التنبيه بأقصى مستوى صوت مفعّل</span>
  </div>

  <div class="orders-grid" id="kitchen-orders-container">
    <div class="no-orders">جاري تحميل الطلبات...</div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://fahma-w-nar-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    window.addEventListener('click', initAudio);
    window.addEventListener('touchstart', initAudio);

    // نفس النغمة السابقة تماماً لكن بأعلى طاقة صوت مضخمة (Max Volume Boost)
    function playLoudAlarmSound() {
      try {
        initAudio();
        
        function tone(freq, duration, delay) {
          setTimeout(() => {
            if (audioCtx && audioCtx.state === 'suspended') {
              audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // العودة لنفس الموجة السابقة (Sawtooth)
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            
            // رفع الصوت إلى الحد الأقصى للمتصفح
            gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
          }, delay);
        }

        // نفس الترتيب والنغمات السابقة بالظبط
        tone(950, 0.18, 0);
        tone(1400, 0.18, 150);
        tone(950, 0.18, 300);
        tone(1400, 0.30, 450);
      } catch (e) {
        console.log("Audio error", e);
      }
    }

    let previousOrdersKeys = [];
    let isInitialLoad = true;

    database.ref('kitchen_orders').on('value', (snapshot) => {
      const container = document.getElementById('kitchen-orders-container');
      container.innerHTML = '';
      
      const orders = snapshot.val();
      if (!orders) {
        container.innerHTML = `<div class="no-orders">لا توجد طلبات جديدة حالياً ☕</div>`;
        isInitialLoad = false;
        previousOrdersKeys = [];
        return;
      }

      let currentActiveKeys = [];
      let hasNewArrival = false;

      Object.keys(orders).forEach(key => {
        const order = orders[key];
        if (order.status === "جديد") {
          currentActiveKeys.push(key);
          
          if (!previousOrdersKeys.includes(key) && !isInitialLoad) {
            hasNewArrival = true;
          }

          let itemsHtml = '';
          if (order.items) {
            order.items.forEach(i => {
              itemsHtml += `<li class="order-item"><span>${i.name}</span> <b>× ${i.qty}</b></li>`;
            });
          }

          container.innerHTML += `
            <div class="order-card" id="card-${key}">
              <div>
                <div class="order-header">
                  <span class="order-number">طلب #${order.orderNum}</span>
                  <span class="car-tag">🚗 ${order.carNumber || 'بدون سيارة'}</span>
                </div>
                <ul class="order-items">
                  ${itemsHtml}
                </ul>
              </div>
              <button class="btn-done" onclick="completeOrder('${key}', '${order.orderNum}')">تم تحضير الطلب ✓</button>
            </div>
          `;
        }
      });

      if (container.innerHTML === '') {
        container.innerHTML = `<div class="no-orders">لا توجد طلبات جديدة حالياً ☕</div>`;
      }

      // تشغيل النغمة السابقة بأعلى مستوى صوت فور وصول طلب جديد
      if (hasNewArrival) {
        playLoudAlarmSound();
      }

      previousOrdersKeys = currentActiveKeys;
      isInitialLoad = false;
    });

    function completeOrder(orderKey, orderNum) {
      initAudio();
      
      const confirmDone = confirm(`هل أنت متأكد من تجهيز الطلب رقم #${orderNum}؟`);
      
      if (confirmDone) {
        database.ref('kitchen_orders/' + orderKey).update({
          status: "مكتمل"
        });
      }
    }
  </script>
</body>
</html>
